# 抓取各内置 harness 发给模型的请求（系统提示词、工具定义）。
# langgraph 不是现成 harness（需自带 langgraph.json 图定义），已排除。
# 先启动 scripts/capture_proxy.py，再运行：
#   OPENAI_API_KEY=dummy ANTHROPIC_API_KEY=dummy uv run --project harbor harbor run -c configs/capture-harnesses.yaml
jobs_dir: jobs/capture-harnesses
n_attempts: 1
timeout_multiplier: 3.0
orchestrator:
  type: local
  n_concurrent_trials: 4
environment:
  type: docker
  force_build: false
  delete: true
agents:
  - name: aider
    model_name: openai/gpt-4o
    base_url: http://host.docker.internal:8765/aider/v1
    model_api_format: openai_chat_completions
  - name: code-puppy
    model_name: openai/gpt-4o
    base_url: http://host.docker.internal:8765/code-puppy/v1
